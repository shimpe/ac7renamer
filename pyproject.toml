[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ac7renamer"
version = "0.2.0"
description = "Change display name of AC7 files."
authors = [{ name = "shiihs" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "ac7parser @ git+https://github.com/shimpe/ac7parser.git@7cb306b0d4b901dcf7a6ead0e4c639b4140df4cb",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
build = ["pyinstaller>=6"]

[project.scripts]
ac7renamer = "ac7renamer.ac7renamer:main"

[tool.hatch.build.targets.wheel]
packages = ["ac7renamer"]

[tool.hatch.build]
include = ["ac7renamer/images/*.png", "ac7renamer/*.ui"]

[tool.hatch.metadata]
allow-direct-references = true
